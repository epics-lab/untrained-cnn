[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "uncnn"
version = "1.0.0"
description = "An untrained (frozen, random-weight) 3D CNN feature extractor for structural brain MRI."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "epics-lab" }]
keywords = ["mri", "neuroimaging", "untrained-cnn", "feature-extraction", "brain"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy",
    "scipy",
    "nibabel",
    "torch",
]

[project.urls]
Homepage = "https://github.com/epics-lab/untrained-cnn"
Repository = "https://github.com/epics-lab/untrained-cnn"
Paper = "https://doi.org/10.64898/2026.06.07.730652"
"Hugging Face" = "https://huggingface.co/epics-lab/untrained-cnn"

[tool.setuptools]
py-modules = ["uncnn"]
